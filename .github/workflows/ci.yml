name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/ledgerflow --set secrets.postgresPassword=ci-only
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra/terraform fmt -check && terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
  container-build:
    runs-on: ubuntu-latest
    strategy: { matrix: { component: [ledger-service, projection-service, frontend] } }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: "${{ matrix.component }}/Dockerfile", push: false, tags: "ledgerflow-${{ matrix.component }}:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
