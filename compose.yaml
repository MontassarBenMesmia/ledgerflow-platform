name: ledgerflow
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ledger"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:8.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "redpanda:9092"]
    healthcheck: { test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"], interval: 8s, timeout: 5s, retries: 20 }
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes: ["./infra/keycloak/ledgerflow-realm.json:/opt/keycloak/data/import/ledgerflow-realm.json:ro"]
    healthcheck: { test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"], interval: 8s, timeout: 5s, retries: 30 }
  ledger-service:
    build: { context: ., dockerfile: ledger-service/Dockerfile }
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KEYCLOAK_ISSUER_URI: http://localhost/realms/ledgerflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ledgerflow/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"], interval: 8s, timeout: 4s, retries: 30 }
  projection-service:
    build: { context: ., dockerfile: projection-service/Dockerfile }
    environment:
      PROJECTION_DB_URL: jdbc:postgresql://postgres:5432/projection
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KEYCLOAK_ISSUER_URI: http://localhost/realms/ledgerflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ledgerflow/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health/readiness"], interval: 8s, timeout: 4s, retries: 30 }
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["80:80"]
    depends_on:
      ledger-service: { condition: service_healthy }
      projection-service: { condition: service_healthy }
      keycloak: { condition: service_healthy }
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [tempo]
  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infra/observability/tempo.yaml:/etc/tempo.yaml:ro"]
  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    ports: ["3000:3000"]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/observability/dashboard.json:/var/lib/grafana/dashboards/ledgerflow.json:ro
    depends_on: [prometheus, tempo]
volumes:
  postgres-data:
