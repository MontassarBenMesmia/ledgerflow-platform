apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: ledgerflow, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/MontassarBenMesmia/ledgerflow-platform.git
    targetRevision: main
    path: deploy/helm/ledgerflow
  destination: { server: https://kubernetes.default.svc, namespace: ledgerflow }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
