server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ledger/ { proxy_pass http://ledger-service:8080/api/; proxy_set_header Authorization $http_authorization; }
  location /api/projection/ { proxy_pass http://projection-service:8082/api/; proxy_set_header Authorization $http_authorization; }
  location /realms/ { proxy_pass http://keycloak:8080/realms/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /resources/ { proxy_pass http://keycloak:8080/resources/; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
